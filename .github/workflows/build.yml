name: Build Ahmed World APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java version
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Verify required files
        run: |
          echo "=== محتوى الجذر ==="
          ls -la
          echo ""
          echo "=== التحقق من الملفات المهمة ==="
          test -f main.py && echo "main.py ✓" || echo "main.py MISSING!"
          test -f buildozer.spec && echo "buildozer.spec ✓" || echo "buildozer.spec MISSING!"
          test -f app_icon.png && echo "app_icon.png ✓" || echo "app_icon.png MISSING!"
          test -f NotoNaskhArabic-Regular.ttf && echo "NotoNaskhArabic-Regular.ttf ✓" || echo "NotoNaskhArabic-Regular.ttf MISSING!"
          test -f Cairo-Regular.ttf && echo "Cairo-Regular.ttf ✓" || echo "Cairo-Regular.ttf not found (optional)"
          echo ""
          echo "=== مجلد الصور ==="
          ls images/ | head -20
          echo "..."
          echo "إجمالي الصور:"
          ls images/ | wc -l

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            libjpeg-dev \
            libfreetype6-dev \
            libpng-dev

      - name: Force Java 17
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64}"
          echo "JAVA_HOME=${JAVA_HOME}" >> $GITHUB_ENV
          echo "PATH=${JAVA_HOME}/bin:${PATH}" >> $GITHUB_ENV
          java -version

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install cython==0.29.36

      - name: Build APK
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64}"
          export PATH="${JAVA_HOME}/bin:${PATH}"
          java -version
          buildozer android debug

      - name: Verify font and images in APK
        run: |
          echo "=== التحقق من محتوى APK ==="
          unzip -l bin/*.apk | grep -i "\.ttf" || echo "WARNING: No font in APK!"
          echo ""
          unzip -l bin/*.apk | grep -c "images/" || echo "No images in APK!"
          echo ""
          unzip -l bin/*.apk | tail -5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ahmed-World-APK
          path: bin/*.apk
          if-no-files-found: error
